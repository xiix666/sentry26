controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: odometry
    controller_frequency: 40.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.15
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 999.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
    FollowPath:
      # controller_frequency: 20.0
      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
      translation_kp: 13.0
      translation_ki: 0.0
      translation_kd: 0.5
      enable_rotation: false
      rotation_kp: 5.0
      rotation_ki: 0.1
      rotation_kd: 0.3
      transform_tolerance: 0.02
      min_max_sum_error: 1.0
      lookahead_dist: 0.3
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 0.15
      min_lookahead_dist: 0.2
      max_lookahead_dist: 1.0
      use_interpolation: False
      use_rotate_to_heading: false
      use_rotate_to_heading_treshold: 0.1
      min_approach_linear_velocity: 0.6
      approach_velocity_scaling_dist: 1.8
      v_linear_min: -3.0
      v_linear_max: 3.0
      v_angular_min: -3.0
      v_angular_max: 3.0
      curvature_min: 0.3                                # 低曲率阈值，低于此值不减速。
      curvature_max: 0.65                                # 高曲率阈值，高于此值大幅减速。
      reduction_ratio_at_high_curvature: 0.8            # 高曲率时的速度降低比例。 0.5 (即减速 50%)
      curvature_forward_dist: 0.7                       # 前向距离，用于曲率计算
      curvature_backward_dist: 0.4                      # 后向距离，用于曲率计算
      large_slow: 0.8
      max_velocity_scaling_factor_rate: 0.8             # 速度缩放因子的最大变化率
      last_vel: 1.4           #如果上一次速度大于这个，曲率减速大减
      lower_speed: 0.5        #每次减速的上限
