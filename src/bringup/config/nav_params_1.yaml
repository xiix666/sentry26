local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 25.0
      publish_frequency: 25.0
      global_frame: odom
      robot_base_frame: fake_base_link
      rolling_window: true              #滚动优化
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.3
      footprint: "[ [0.33, 0.33], [0.33, -0.33], [-0.33, -0.33], [-0.33, 0.33] ]"
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: xx_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        continuous_hit_threshold: 1          # 连续命中2次
        neighborhood_radius: 2               # 5x5邻域（半径2）
        neighborhood_min_voxels: 1   
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.2
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.2
        max_obstacle_intensity: 2.0
        max_gradient_threshold: 1.0
        observation_sources: terrain_map_local
        terrain_map_local:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map_local
          sensor_frame: fake_base_link
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 25.0
      publish_frequency: 25.0
      global_frame: map
      robot_base_frame: fake_base_link
      robot_radius: 0.3
      footprint: "[ [0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      # obstacle_layer:
        # plugin: "nav2_costmap_2d::ObstacleLayer"
        # plugin: "decaying_layer::DecayingObstacleLayer"
        # enabled: True
        # footprint_clearing_enabled: true
        # decay_time: 0.0          # default 0.0s
        # observation_sources: scan depth
        # scan:
        #   topic: /cloud_segmented
        #   max_obstacle_height: 2.0
        #   clearing: True
        #   marking: True
        #   data_type: "PointCloud2"
        #   raytrace_max_range: 7.5
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 7.0
        #   obstacle_min_range: 0.4
        # depth:
        #   topic: /scan
        #   max_obstacle_height: 1.0
        #   clearing: True
        #   marking: True
        #   data_type: "LaserScan"
        #   raytrace_max_range: 2.5
        #   raytrace_min_range: 0.0
        #   obstacle_max_range: 2.0
        #   obstacle_min_range: 0.4
      intensity_voxel_layer:
        plugin: xx_nav2_costmap_2d::IntensityVoxelLayer
        continuous_hit_threshold: 0          # 连续命中2次
        neighborhood_radius: 2               # 5x5邻域（半径2）
        neighborhood_min_voxels: 0           # 邻域内至少3个有效体素
        obstacle_hold_time: 0.5              # 障碍物保持时间
        obstacle_expand_size: 0
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_cluster_points: 3
        point_cluster_tolerance: 0.15
        static_obs_min_x: 7.3  #home
        static_obs_min_y: 0.5
        static_obs_max_x: 7.35
        static_obs_max_y: 1.5
        min_obstacle_height: 0.2
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.2
        max_obstacle_intensity: 2.0
        max_gradient_threshold: 1.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /terrain_map_ext
          sensor_frame: fake_base_link
          min_obstacle_height: 0.2
          max_obstacle_height: 2.0
          obstacle_max_range: 15.0
          obstacle_min_range: 0.35
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.6
      always_send_full_costmap: False

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
map_server:
  ros__parameters:
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # plugin: "nav2_smac_planner/SmacPlanner2D"
      # tolerance: 0.11                      # tolerance for planning if unable to reach exact pose, in meters
      # downsample_costmap: false             # whether or not to downsample the map
      # downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      # allow_unknown: True                   # allow traveling in unknown space
      # max_iterations: 50000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      # max_on_approach_iterations: 100      # maximum number of iterations to attempt to reach goal once in tolerance
      # max_planning_time: 0.5                # max time in s for planner to plan, smooth
      # cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      # use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      # smoother:
      #   max_iterations: 500
      #   w_smooth: 0.1
      #   w_data: 0.4
      #   tolerance: 1.0e-8

      # plugin: "nav2_navfn_planner/NavfnPlanner"
      # tolerance: 0.1
      # use_astar: false
      # allow_unknown: true

      plugin: "theta_star_planner/ThetaStarPlanner" # In Iron and older versions, "/" was used instead of "::"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.5
      w_heuristic_cost: 1.0

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-12
      max_its: 10000
      do_refinement: True

fake_vel_transform:
  ros__parameters:
    use_sim_time: true
    odom_topic: "odometry"
    robot_base_frame: "base_link"
    fake_robot_base_frame: "fake_base_link"
    input_cmd_vel_topic: "cmd_vel"
    output_cmd_vel_topic: "cmd_vel_base"
    output_safe_cmd_vel_topic: "cmd_vel_safe"
    # cmd_spin_topic: "cmd_spin"
    # init_spin_speed: 3.14

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
      # plugin: "nav2_behaviors/BackUp"
      # plugin: "nav2_behaviors/BackUpTwzFree"
      max_radius: 1.0
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: fake_base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    # params for pb_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    robot_radius: 0.4
    max_radius: 2.0
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20  #检查导航任务结果的频率
    stop_on_failure: false #如果单个航点失败继续移动到下一个航点
    waypoint_task_executor_plugin: "wait_at_waypoint" #到达航点后暂停指定长度的时间
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 80.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 3.0, 3.0]
