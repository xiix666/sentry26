    max_accel: [4.0, 4.0, 5.0]
    max_decel: [-4.0, -4.0, -5.0]
    odom_topic: "odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

