# Fake Publisher Configuration File
# This file contains configuration for camera data and referee system data

# Referee System Data Configuration
referee:
  game_progress: 4          # 比赛进行中
  stage_remain_time: 300    # 5分钟 (seconds)
  red_blue: 1               # 红方 (0=blue, 1=red)

  # Team Health
  self_hero_hp: 210         # 英雄满血
  self_infantry_hp: 210     # 步兵满血
  self_sentry_hp: 400      # 哨兵满血

  # Ammo and Power
  bullets_allowance: 300    # 弹药限额
  # chassis_power: 30.0     # 底盘功率 (commented out)

  # Alliance Game Info
  center_status: 2
  remain_gold: 0

  # Robot Positions
  self_pose_x: 1.5          # 哨兵X位置
  self_pose_y: 4.0          # 哨兵Y位置
  hero_pose_x: 6.0          # 英雄X位置
  hero_pose_y: 4.0          # 英雄Y位置
  infantry_pose_x: 5.0      # 步兵X位置
  infantry_pose_y: 1.5      # 步兵Y位置

# Camera Data Configuration
# Each camera has 5 enemy types: hero, engineer, infantry1, infantry2, sentry
# id: 0 = not detected, >0 = detected enemy ID
cameras:
  camera_1:  # 主要检测区域
    hero:      {id: 0, x: 0.75, y: 6.0}
    engineer:  {id: 0, x: 7.5,  y: 5.5}
    infantry1: {id: 0, x: 7.0,  y: 5.0}
    infantry2: {id: 0, x: 6.5,  y: 4.5}
    sentry:    {id: 0, x: 6.0,  y: 4.0}

  camera_2:  # 左侧检测
    hero:      {id: 0, x: 2.0,  y: 7.0}
    engineer:  {id: 0, x: 1.5,  y: 6.5}
    infantry1: {id: 0, x: 1.0,  y: 6.0}
    infantry2: {id: 0, x: 3.0,  y: 6.0}
    sentry:    {id: 0, x: 2.5,  y: 5.5}

  camera_3:  # 右侧检测
    hero:      {id: 0, x: 9.0,  y: 5.0}
    engineer:  {id: 0, x: 9.5,  y: 4.5}
    infantry1: {id: 0, x: 10.0, y: 4.0}
    infantry2: {id: 0, x: 10.5, y: 3.5}
    sentry:    {id: 0, x: 11.0, y: 3.0}

  camera_4:  # 后方检测
    hero:      {id: 0, x: 6.0,  y: 0.5}
    engineer:  {id: 0, x: 5.5,  y: 0.8}
    infantry1: {id: 0, x: 6.5,  y: 0.8}
    infantry2: {id: 0, x: 7.0,  y: 0.5}
    sentry:    {id: 0, x: 5.0,  y: 1.0}

# Enemy Speed Configuration (shared across all cameras for same enemy type)
enemy_speeds:
  hero:      {x: -1.2, y: 0.0}   # 英雄向左移动
  engineer:  {x: 0.5,  y: 0.0}   # 工程缓慢右移
  infantry1: {x: 0.8,  y: 0.0}   # 步兵1右移
  infantry2: {x: -0.3, y: 0.0}   # 步兵2缓慢左移
  sentry:    {x: 1.5,  y: -0.8}  # 哨兵快速右移并向下移动